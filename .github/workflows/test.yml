name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 2am UTC — runs E2E tests
    - cron: "0 2 * * *"
  # The e2e job gates on workflow_dispatch but the trigger was never declared,
  # so E2E could only ever run on the nightly cron — nobody could re-run it to
  # confirm a fix. Declaring it here makes the existing condition reachable.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ── Unit Tests (every push) ────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    # A hung test (e.g. the NewVacancyModal render loop fixed 2026-07-12)
    # otherwise burns GitHub's 6-hour default before failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Integration Tests (PRs to main) ────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amana_eos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/amana_eos_test
      DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/amana_eos_test
      NEXTAUTH_SECRET: test-secret
      CRON_SECRET: test-cron-secret
      COWORK_API_KEY: test-cowork-api-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client & push schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run integration tests
        run: npm run test:integration

  # ── E2E Tests (nightly or pre-deploy) ──────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # 130 specs run serially (workers: 1, fullyParallel: false) with retries: 2
    # in CI, so a handful of genuine failures can each burn 3 x the 60s test
    # timeout. 40 minutes was not enough once the suite actually started
    # running; the job was killed mid-suite with no usable result.
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amana_eos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/amana_eos_test
      DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/amana_eos_test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: test-cron-secret
      COWORK_API_KEY: test-cowork-api-key
      # parent-auth.ts throws when this is unset, so any spec touching a parent
      # session fails at import. Must be >= 32 bytes for HS256.
      PARENT_JWT_SECRET: test-parent-jwt-secret-at-least-32-chars-long
      # playwright.config.ts only injects MOCK_PDF via its `webServer` block,
      # which is disabled under CI — so CI has to set it itself, as that file's
      # own comment spells out. Without it the contract-issue route tries to
      # launch a nested Chromium to render a PDF.
      MOCK_PDF: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client & push schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Seed test data
        run: npx tsx -e "import { seedTestData } from './src/lib/test-utils/seed-test-data'; seedTestData().then(() => console.log('Seeded'))"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `next build` directly, not `npm run build`. The schema is created by
      # `prisma db push` above, which leaves no migration history — so a
      # `prisma migrate deploy` in the build would see a populated schema with
      # an empty _prisma_migrations table and abort with P3005. The build step
      # has no business running migrations anyway; production migrations come
      # from vercel.json's buildCommand.
      - name: Build application
        run: npx next build

      - name: Run E2E tests
        run: |
          npx next start &
          npx wait-on http://localhost:3000 --timeout 30000
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
